name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r task4/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile task4/data_analysis.py

      - name: Build Docker image
        run: |
          docker build \
            -t marcedisonestaca/diet-analysis:latest \
            ./task4

      - name: Run Docker container
        run: |
          docker run \
            --name diet-analysis-test \
            marcedisonestaca/diet-analysis:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: |
          docker push marcedisonestaca/diet-analysis:latest