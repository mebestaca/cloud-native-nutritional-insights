name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r task4/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile task4/data_analysis.py

      - name: Build Docker image
        run: |
          docker build -t diet-analysis:latest ./task4

      - name: Run Docker container
        run: |
          docker run --name diet-analysis-test diet-analysis:latest